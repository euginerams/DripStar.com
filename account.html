<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account | DRIPSTARS.COM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="account.css" />
  </head>
  <body>
    <!-- ============ AUTH SCREEN (login / sign up) ============ -->
    <div class="auth-screen" id="authScreen">
      <div class="auth-card">
        <a href="index.html" class="back-link">← Back to shop</a>
        <p class="eyebrow">DRIPSTARS.COM</p>
        <h1>My Account</h1>

        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Sign in</button>
          <button class="auth-tab" data-tab="signup">Create account</button>
        </div>

        <!-- Sign in -->
        <form class="auth-form" id="loginForm">
          <label
            >Email<input
              type="email"
              id="loginEmail"
              required
              autocomplete="username"
          /></label>
          <label
            >Password<input
              type="password"
              id="loginPassword"
              required
              autocomplete="current-password"
          /></label>
          <p class="auth-msg auth-error" id="loginError" hidden></p>
          <button class="btn btn-gold full" type="submit">Sign in</button>
        </form>

        <!-- Sign up -->
        <form class="auth-form" id="signupForm" hidden>
          <label
            >Full name<input
              type="text"
              id="signupName"
              required
              autocomplete="name"
          /></label>
          <label
            >Email<input
              type="email"
              id="signupEmail"
              required
              autocomplete="username"
          /></label>
          <label
            >Phone / WhatsApp number<input
              type="tel"
              id="signupPhone"
              required
              autocomplete="tel"
          /></label>
          <label
            >Password<input
              type="password"
              id="signupPassword"
              required
              minlength="6"
              autocomplete="new-password"
          /></label>
          <p class="auth-msg auth-error" id="signupError" hidden></p>
          <button class="btn btn-gold full" type="submit">
            Create account
          </button>
        </form>

        <!-- Verify email code -->
        <form class="auth-form" id="verifyForm" hidden>
          <p class="verify-copy">
            We sent a 6-digit code to <strong id="verifyEmailDisplay"></strong>.
            Enter it below to verify your account.
          </p>
          <label
            >Verification code
            <input
              type="text"
              id="verifyCode"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="6"
              required
              autocomplete="one-time-code"
            />
          </label>
          <p class="auth-msg auth-error" id="verifyError" hidden></p>
          <p class="auth-msg auth-success" id="verifySuccess" hidden></p>
          <button class="btn btn-gold full" type="submit">
            Verify and continue
          </button>
          <div class="verify-links">
            <button type="button" class="link-btn" id="resendCodeBtn">
              Resend code
            </button>
            <button type="button" class="link-btn" id="backToSignupBtn">
              Use a different email
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ============ CUSTOMER DASHBOARD (shown after login) ============ -->
    <div class="dashboard" id="dashboard" hidden>
      <header class="account-top">
        <a href="index.html" class="account-brand">
          <strong>DRIPSTARS<span>.COM</span></strong>
          <small>MY ACCOUNT</small>
        </a>
        <div class="account-top-actions">
          <a class="btn btn-outline" href="index.html">Back to shop</a>
          <button class="btn btn-outline" id="signOutBtn">Sign out</button>
        </div>
      </header>

      <main class="account-main">
        <section class="account-section">
          <h2>My details</h2>
          <form id="profileForm" class="profile-form">
            <label>Full name<input type="text" id="profileName" /></label>
            <label
              >Phone / WhatsApp number<input type="tel" id="profilePhone"
            /></label>
            <label
              >Email<input type="email" id="profileEmail" disabled
            /></label>
            <label
              >Delivery address<textarea
                id="profileAddress"
                rows="3"
              ></textarea>
            </label>
            <label
              >Preferred delivery method
              <select id="profileDelivery">
                <option>PostNet counter-to-counter</option>
                <option>Courier Guy door-to-door</option>
                <option>Collect in person</option>
              </select>
            </label>
            <p class="auth-msg auth-success" id="profileSaved" hidden>Saved.</p>
            <button class="btn btn-gold" type="submit">Save details</button>
          </form>
        </section>

        <section class="account-section">
          <h2>My orders</h2>
          <div id="ordersList" class="orders-list"></div>
          <p class="empty-state" id="ordersEmpty" hidden>
            You haven't placed any orders yet.
          </p>
          <p class="loading-state" id="ordersLoading">Loading your orders...</p>
        </section>
      </main>
    </div>

    <!-- ============ REDIRECTING TO OWNER DASHBOARD ============ -->
    <div class="redirect-screen" id="redirectScreen" hidden>
      <p>Signing you in to the owner dashboard...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="account.js"></script>
  </body>
</html>
